  function timeAgo(iso) {
    if (!iso) return '...'; const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (currentLang === 'zh') {
      if (diff < 60) return '刚刚'; if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
      if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前'; return Math.floor(diff / 86400) + ' 天前';
    } else if (currentLang === 'ms') {
      if (diff < 60) return 'Baru sahaja'; if (diff < 3600) return Math.floor(diff / 60) + ' min lalu';
      if (diff < 86400) return Math.floor(diff / 3600) + ' jam lalu'; return Math.floor(diff / 86400) + ' hari lalu';
    } else {
      if (diff < 60) return 'Just now'; if (diff < 3600) return Math.floor(diff / 60) + ' mins ago';
      if (diff < 86400) return Math.floor(diff / 3600) + ' hours ago'; return Math.floor(diff / 86400) + ' days ago';
    }
  }
  function getDistance(lat1, lon1, lat2, lon2) {
    if (lat1 == null || lon1 == null || lat2 == null || lon2 == null) return null;
    const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  async function addItem() {
    const text = inputEl.value.trim();
    if (!text) { inputEl.focus(); return; }
    btnEl.disabled = true; btnEl.textContent = '...';

    let imageUrl = null;
    if (selectedFile) {
      const fileExt = selectedFile.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
      const { error: uploadError } = await supabase.storage.from('images').upload(fileName, selectedFile);
      if (uploadError) { alert('Image upload failed: ' + uploadError.message); btnEl.disabled = false; btnEl.textContent = t('btnSubmit'); return; }
      const { data: urlData } = supabase.storage.from('images').getPublicUrl(fileName);
      imageUrl = urlData.publicUrl;
    }

    const newItem = {
      text: text, cat: currentCat, state: currentPubState, district: currentPubDist,
      done: false, user_id: currentUser.id, lat: myLat, lng: myLng, radius_km: 2, image_url: imageUrl, likes: []

    const { data, error } = await supabase.from('demands').insert([newItem]).select();

    if (error) { alert('Failed: ' + error.message); return; }
    
    inputEl.value = ''; imageInput.value = ''; selectedFile = null; imagePreview.style.display = 'none';

  function checkUnreadStatus() {
    if (!currentUser) return;

    CATS.forEach(cat => {
      const dotEl = document.getElementById(`dot-${cat.key}`);
      if (!dotEl) return;

      const lastRead = lastReadTimes[cat.key] ? new Date(lastReadTimes[cat.key]).getTime() : 0;

      const hasNew = globalItems.some(it => {
        if (it.cat !== cat.key || it.user_id === currentUser.id || hiddenIds.includes(it.id)) return false;
        if (!it.state || !it.district) return false;
        if (it.state !== currentPubState || it.district !== currentPubDist) return false;

        const createTime = new Date(it.created_at).getTime();
        if (createTime <= lastRead) return false;

        if (myLat && myLng && it.lat && it.lng) {
          const dist = getDistance(myLat, myLng, it.lat, it.lng);
          if (maxDistance !== 999 && dist > maxDistance) return false;
          const itemRadius = it.radius_km || 2; 
          if (itemRadius !== 999 && dist > itemRadius) return false;
        }
        return true;
      });

      if (hasNew && currentCat !== cat.key) dotEl.style.display = 'block';
      else if (currentCat === cat.key) dotEl.style.display = 'none';
    });
  }

        priceHint.innerHTML = t('btnFree');
      }
    }
  }

  async function autoTranslateDOM(elementId, originalText) {
    const el = document.getElementById(elementId);
    if (!el) return;
    if (currentLang === 'zh') { el.textContent = originalText; return; }
    
    const cacheKey = originalText + '_' + currentLang;
    if (translatedCache[cacheKey]) {
      el.textContent = translatedCache[cacheKey];
      return;
    }

    el.textContent = originalText; 

    const translated = await translateText(originalText);
    translatedCache[cacheKey] = translated;
    
    if (document.getElementById(elementId)) {
        const newEl = document.getElementById(elementId);
        newEl.textContent = translated;
    }
  }

  function render() {
    listEl.innerHTML = '';
    
    let filtered = globalItems.filter(it => {
      if (currentCat !== 'all' && it.cat !== currentCat) return false;
      
      const isMine = it.user_id === currentUser.id;
      if (!isMine && hiddenIds.includes(it.id)) return false;

      if (!isMine) {
        if (!it.state || !it.district) return false; 
        if (it.state !== currentPubState || it.district !== currentPubDist) return false;
      }

      if (myLat && myLng && it.lat && it.lng) {
        const dist = getDistance(myLat, myLng, it.lat, it.lng);
        if (maxDistance !== 999 && dist > maxDistance) return false;
        const itemRadius = it.radius_km || 2; 
        if (itemRadius !== 999 && dist > itemRadius) return false;
      }
      return true;
    });

    if (globalSort === 'distance' && myLat && myLng) {
      filtered.sort((a, b) => {
        const dA = (a.lat && a.lng) ? getDistance(myLat, myLng, a.lat, a.lng) : 99999;
        const dB = (b.lat && b.lng) ? getDistance(myLat, myLng, b.lat, b.lng) : 99999;
        return dA - dB;
      });
    }

    if (filtered.length === 0) {
      listEl.innerHTML = `<div class="empty">${t('empty')}</div>`; countEl.textContent = ''; 
      checkUnreadStatus(); 
      return;
    }

    let latestId = filtered.find(it => !it.done)?.id;

    filtered.forEach(item => {
      try {
        const cat = CAT_MAP[item.cat] || CAT_MAP.chat;
        const isMine = item.user_id === currentUser.id;
        
        let distHtml = '';
        if (myLat && myLng && item.lat && item.lng) {
          const dist = getDistance(myLat, myLng, item.lat, item.lng);
          let distText = dist < 1 ? Math.round(dist * 1000) + ' m' : dist.toFixed(1) + ' km';
          distHtml = `<span class="tag dist-tag">🚶 ${distText}</span>`;
        }

        const r = item.radius_km || 2;
        let radiusHtml = `<span class="tag radius-tag">📢 ${r === 999 ? 'Whole City' : r + 'km'}</span>`;

        let expandBtnHtml = '';
        const publishTime = new Date(item.created_at || Date.now()).getTime();
        const diffMinutes = (Date.now() - publishTime) / 1000 / 60;
        if (isMine && !item.done && diffMinutes >= 3 && r !== 999) {
          let btnText = '📢 Expand Radius (+4km)';
          expandBtnHtml = `<button class="expand-btn" onclick="window.expandRadius('${item.id}', ${r})">${btnText}</button>`;
        }

        let imgHtml = item.image_url ? `<img src="${item.image_url}" class="img-preview" onclick="window.open('${item.image_url}')" alt="img">` : '';

        let mapBtnHtml = '';
        if (item.lat && item.lng) {
            mapBtnHtml = `<a href="https://maps.google.com/?q=${item.lat},${item.lng}" target="_blank" class="map-btn">${t('btnMap')}</a>`;
        }

        const likesArr = item.likes || [];
        const isLiked = likesArr.includes(currentUser.id);
        const likeBtnHtml = `<button class="like-btn ${isLiked ? 'liked' : ''}" onclick="window.toggleLike('${item.id}')">${isLiked ? '❤️' : '🤍'} ${likesArr.length}</button>`;

        let replyBtnHtml = '';
        if (isMine) {
          const relatedMsgs = incomingMessages.filter(m => m.demand_id === item.id);
          const uniqueSenders = [...new Set(relatedMsgs.map(m => m.sender_id))];
          if (uniqueSenders.length > 0) {
            replyBtnHtml = `<button class="reply-btn" onclick="window.openChatList('${item.id}')">${t('btnReplyList', uniqueSenders.length)}</button>`;
          }
        }

        const priceLabel = cat.price > 0 
            ? `<span class="tag price-tag">💰 RM ${cat.price}</span>` 
            : `<span class="tag price-tag" style="background:#e8f5e9;color:#2e7d32;border-color:#a5d6a7;">${t('btnFree')}</span>`;

        const row = document.createElement('div');
        row.className = 'item' + (item.id === latestId ? ' latest' : '') + (item.done ? ' done' : '');
        
        const textId = 'txt_' + item.id.replace(/-/g, '');

        row.innerHTML = `
          <span class="dot"></span>
          <div class="bubble">
            <div class="bubble-head">
              ${priceLabel}
              ${distHtml}
              <span class="tag ${cat.key}">${cat.icon} ${getCatName(cat)}</span>
              ${isMine ? radiusHtml : ''}
              ${item.done ? `<span class="tag" style="background:#e0e0e0;color:#616161;margin-left:auto;">${t('btnDone')}</span>` : ''}
            </div>
            <p class="text" id="${textId}"></p> 
            ${imgHtml}
            ${expandBtnHtml}
            <div class="meta" style="margin-bottom: 5px;">
                ${mapBtnHtml}
            </div>
            <div class="meta">
              <span class="time">${timeAgo(item.created_at)}</span>
              ${likeBtnHtml}
              ${isMine ? `
                ${replyBtnHtml}
                <button class="done-btn" onclick="window.toggleDone('${item.id}', ${item.done})">${item.done ? t('btnUndo') : t('btnDone')}</button>
                <button class="del" onclick="window.removeItem('${item.id}')">×</button>
              ` : `
                <button class="help-btn" onclick="window.openChat('${item.id}', '${item.user_id}', '${myUserCode}')">${t('btnHelp', cat.price)}</button>
                <button class="hide-btn" onclick="window.hideItem('${item.id}')">${t('btnHide')}</button>
              `}
            </div>
          </div>
        `;
        listEl.appendChild(row);
        
        setTimeout(() => autoTranslateDOM(textId, item.text), 100);

      } catch (err) { console.error("Render Error", item, err); }
    });

    const pending = filtered.filter(it => !it.done).length;
    countEl.textContent = t('count', filtered.length, pending);
    checkUnreadStatus();
  }

  const chatListModal = document.getElementById('chatListModal');
  const chatListBody = document.getElementById('chatListBody');

  window.openChatList = (demandId) => {
    const relatedMsgs = incomingMessages.filter(m => m.demand_id === demandId);
    const uniqueSenders = [...new Set(relatedMsgs.map(m => m.sender_id))];
    
    if (uniqueSenders.length === 0) return;

    chatListBody.innerHTML = '';
    
    uniqueSenders.forEach(senderId => {
      const userMsgs = relatedMsgs.filter(m => m.sender_id === senderId);
      const lastMsg = userMsgs[0]; 
      const senderCode = 'HIBRO-' + senderId.split('-')[0].toUpperCase();
      
      const div = document.createElement('div');
      div.className = 'chat-list-item';
      div.onclick = () => {
        chatListModal.style.display = 'none';
        window.openChat(demandId, senderId, senderCode);
      };
      
      const msgId = 'msglist_' + senderId.replace(/-/g, '');
      div.innerHTML = `
        <div class="chat-list-user">👤 ${senderCode}</div>
        <div class="chat-list-msg" id="${msgId}"></div>
        <div style="font-size:11px; color:#aaa; text-align:right;">${timeAgo(lastMsg.created_at)}</div>
      `;
      chatListBody.appendChild(div);
      
      setTimeout(() => autoTranslateDOM(msgId, lastMsg.content), 100);
    });

    chatListModal.style.display = 'flex';
  };

  window.closeChatList = () => {
    chatListModal.style.display = 'none';
  };

  const chatModal = document.getElementById('chatModal');
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');

  window.openChat = async (demandId, receiverId, titleText) => {
    if (receiverId === currentUser.id) return alert('Cannot chat with yourself');
    chatDemandId = demandId; chatReceiverId = receiverId;
    
    chatTitle.textContent = t('chatTitle', titleText);
    
    chatModal.style.display = 'flex';
    toastEl.style.display = 'none';
    chatMessages.innerHTML = '<div style="text-align:center;color:#999;font-size:12px;">Loading...</div>';
    chatInput.value = '';
    
    await loadMessages();

    if (chatPollTimer) clearInterval(chatPollTimer);
    chatPollTimer = setInterval(() => { if (chatDemandId) loadMessages(); }, 1500);

    if (chatChannel) supabase.removeChannel(chatChannel);
    chatChannel = supabase.channel('chat-' + demandId)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `demand_id=eq.${demandId}` }, payload => { loadMessages(); }).subscribe();
  };

  window.closeChat = () => {
    chatModal.style.display = 'none';
    if (chatChannel) { supabase.removeChannel(chatChannel); chatChannel = null; }
    if (chatPollTimer) { clearInterval(chatPollTimer); chatPollTimer = null; }
    chatDemandId = null; chatReceiverId = null;
  };

  let lastMsgCount = 0; 

  async function loadMessages() {
    const { data, error } = await supabase.from('messages').select('*').eq('demand_id', chatDemandId).order('created_at', { ascending: true });
    if (error) return;

    const myMsgs = data.filter(m => (m.sender_id === currentUser.id && m.receiver_id === chatReceiverId) || (m.sender_id === chatReceiverId && m.receiver_id === currentUser.id));

    if (myMsgs.length === 0) {
      chatMessages.innerHTML = '<div style="text-align:center;color:#999;margin-top:20px;">Say hi~</div>';
    } else {
      chatMessages.innerHTML = '';
      myMsgs.forEach((m, index) => {
        const isMine = m.sender_id === currentUser.id;
        const div = document.createElement('div');
        div.className = `msg-bubble ${isMine ? 'msg-mine' : 'msg-other'}`;
        div.id = 'chatmsg_' + index;
        if (isMine) {
           div.textContent = m.content;
        } else {
           div.textContent = m.content; 
           setTimeout(() => autoTranslateDOM('chatmsg_' + index, m.content), 50);
        }
        chatMessages.appendChild(div);
      });
      
      if (myMsgs.length > lastMsgCount) {
        chatMessages.scrollTop = chatMessages.scrollHeight;
        lastMsgCount = myMsgs.length;
      }
    }
  }

  window.sendMsg = async () => {
    const val = chatInput.value.trim();
    if (!val) return;
    chatInput.value = '';
    
    const tempDiv = document.createElement('div');
    tempDiv.className = 'msg-bubble msg-mine';
    tempDiv.textContent = val;
    if (chatMessages.querySelector('div[style]')) chatMessages.innerHTML = ''; 
    chatMessages.appendChild(tempDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    await supabase.from('messages').insert([{ demand_id: chatDemandId, sender_id: currentUser.id, receiver_id: chatReceiverId, content: val }]);
    
    chatInput.focus();
    loadMessages(); 
  };

  chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') window.sendMsg(); });


  const csModal = document.getElementById('csModal');
  const csTextarea = document.getElementById('csTextarea');
  const csSubmitBtn = document.getElementById('csSubmitBtn');

  window.openCustomerService = () => {
    const waText = encodeURIComponent(`Hello, I am ${myUserCode}. I need help.`);
    csWaBtn.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${waText}`;
    csModal.style.display = 'flex';
    csTextarea.value = '';
    csSubmitBtn.textContent = t('csBtnSubmit');
    csSubmitBtn.disabled = false;
  };

  window.closeCustomerService = () => {
    csModal.style.display = 'none';
  };

  window.submitTicket = async () => {
    const content = csTextarea.value.trim();
    if (!content) { alert('Please fill in details'); return; }

    csSubmitBtn.textContent = '...';
    csSubmitBtn.disabled = true;

    const user_info = `${myUserCode} | ${currentUser.email}`;

    const { error } = await supabase.from('tickets').insert([
      { user_email: user_info, content: content }
    ]);

    if (error) {
      alert('Failed: ' + error.message);
      csSubmitBtn.textContent = t('csBtnSubmit');
      csSubmitBtn.disabled = false;
    } else {
      csSubmitBtn.textContent = '✅ Success';
      csSubmitBtn.style.background = '#4CAF50';
      setTimeout(() => {
        window.closeCustomerService();
        csSubmitBtn.style.background = '#2196F3';
      }, 2000);
    }
  };

  window.toggleDone = toggleDone; 
  window.removeItem = removeItem; 
  window.expandRadius = expandRadius;
  window.toggleLike = toggleLike; 
  btnEl.addEventListener('click', addItem);

  checkUser();
})();
</script>
</body>
</html>
