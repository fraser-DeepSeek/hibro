  #authBox h3 { margin: 0 0 15px; color: #333; }
  .auth-input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
  .auth-btn { width: 100%; padding: 12px; background: var(--green); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
  .auth-btn.secondary { background: #eee; color: #333; }
  .auth-msg { font-size: 14px; color: #d32f2f; margin-bottom: 10px; min-height: 20px; }

  #mainApp { display: none; }
  .user-bar { max-width: 600px; margin: 0 auto 10px; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.7); padding: 10px 15px; border-radius: 10px; }
  .logout-btn { background: #ff5252; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold;}

  /* GPS 状态条 */
  .gps-bar { max-width: 600px; margin: 0 auto 15px; display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 10px 15px; border-radius: 10px; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.05); }
  .gps-status { color: #666; }
  .gps-status.on { color: var(--green); font-weight: bold; }
  .range-select { padding: 5px; border-radius: 5px; border: 1px solid #a5d8a0; outline: none; font-weight: bold; color: #2e7d32; }

  .input-row{ display:flex; gap:10px; width:100%; max-width:600px; margin:10px auto 0; }
  #demandInput{ flex:1 1 auto; min-width:0; font-size:17px; padding:14px 18px; border:none; border-radius:999px; outline:none; text-align:center; color:#222; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.08); font-family:inherit; }
  #submitBtn{ flex:0 0 auto; font-size:17px; font-weight:700; padding:14px 26px; border:none; border-radius:999px; background:#ffd400; color:#4a3b00; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.12); font-family:inherit; }

  .select-group label{ display:block; font-size:13px; font-weight:600; color:#4c6b4c; margin-bottom:5px; padding-left:4px; }
  .select-group select{ width:100%; font-size:15px; font-family:inherit; padding:10px 12px; border:1.5px solid #a5d8a0; border-radius:10px; background:#fff; color:#222; outline:none; cursor:pointer; appearance:none; }

  .count{ margin-top:10px; text-align:center; color:#5b7a5b; font-size:14px; }
  .loading { color: #4c6b4c; padding: 20px; font-weight: bold; }

  function getDistance(lat1, lon1, lat2, lon2) {
    if (!lat1 || !lon1 || !lat2 || !lon2) return null;
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

          maxDistance = 999;

        },
        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
      );
    }
  }

    await supabase.from('demands').update({ done: !currentStatus }).eq('id', id);
    // 这里也不需要 fetchData，Realtime 会触发刷新
  }

  async function removeItem(id) {
    if(!confirm('确定要删除这条需求吗？')) return;
    await supabase.from('demands').delete().eq('id', id);
    // 同样依靠 Realtime 刷新
  }

  // --- 升级：新扩圈逻辑 (2 -> 6 -> 10 -> 999) ---
  async function expandRadius(id, currentRadius) {
    let newRadius = currentRadius;
    
    if (currentRadius === 2) {
      newRadius = 6;
    } else if (currentRadius === 6) {
      newRadius = 10;
    } else {
      newRadius = 999; // 超过10直接全城
    }
    
    await supabase.from('demands').update({ radius_km: newRadius }).eq('id', id);
    // 依然依靠 Realtime 刷新
  }

  function initSelectors() {
    pubStateSel.innerHTML = MALAYSIA.map(s => `<option value="${s.key}">${s.name}</option>`).join('');
    pubStateSel.value = currentPubState;
    updatePubDistrict();
    pubStateSel.addEventListener('change', (e) => {
      currentPubState = e.target.value;
      updatePubDistrict();
    });
    pubDistSel.addEventListener('change', (e) => { currentPubDist = e.target.value; });
  }

  function updatePubDistrict() {
    const st = STATE_MAP[currentPubState];
    pubDistSel.innerHTML = st.districts.map(d => `<option value="${d}">${d}</option>`).join('');
    currentPubDist = st.districts[0] || '';
  }

  function buildCatChips() {
    let html = '<div class="label">🏷️ 分类：</div>';
    CATS.forEach(c => {
      html += `<button class="chip ${c.key === currentCat ? 'active' : ''}" data-key="${c.key}">${c.icon} ${c.name}</button>`;
    });
    catRow.innerHTML = html;
    catRow.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', (e) => {
        currentCat = e.target.dataset.key;
        catRow.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        render();
      });
    });
  }

  function render() {
    listEl.innerHTML = '';
    
    // 过滤逻辑
    const filtered = globalItems.filter(it => {
      if (currentCat !== 'all' && it.cat !== currentCat) return false;
      
      if (myLat && myLng && it.lat && it.lng) {
        const dist = getDistance(myLat, myLng, it.lat, it.lng);
        
        // 1. 我的查看范围 (默认 2 公里)
        if (maxDistance !== 999 && dist > maxDistance) return false;
        
        // 2. 对方的广播范围
        const itemRadius = it.radius_km || 2; // 兼容旧数据，默认2
        if (itemRadius !== 999 && dist > itemRadius) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      listEl.innerHTML = '<div class="empty">您设定的距离内还没有此类需求，去帮帮更远的人吧~</div>';
      countEl.textContent = '';
      return;
    }

    let latestId = filtered.find(it => !it.done)?.id;

    filtered.forEach(item => {
      const cat = CAT_MAP[item.cat] || CAT_MAP.chat;
      const isMine = item.user_id === currentUser.id;
      
      let distHtml = '';
      if (myLat && myLng && item.lat && item.lng) {
        const dist = getDistance(myLat, myLng, item.lat, it.lng);
        let distText = dist < 1 ? Math.round(dist * 1000) + ' 米' : dist.toFixed(1) + ' 公里';
        distHtml = `<span class="tag dist-tag">🚶 距离你 ${distText}</span>`;
      }

      const r = item.radius_km || 2;
      let radiusHtml = `<span class="tag radius-tag">📢 广播 ${r === 999 ? '全城' : r + '公里'}</span>`;

      // 扩圈按钮逻辑 (3分钟后显示)
      let expandBtnHtml = '';
      const publishTime = new Date(item.created_at).getTime();
      const diffMinutes = (Date.now() - publishTime) / 1000 / 60;
      
      if (isMine && !item.done && diffMinutes >= 3 && r !== 999) {
        let btnText = `📢 超过3分钟无响应，扩大范围 (+4公里)`; // 升级：每次加4公里
        if (r === 10) btnText = '📢 向全城广播求助';
        expandBtnHtml = `<button class="expand-btn" onclick="window.expandRadius('${item.id}', ${r})">${btnText}</button>`;
      }

      const row = document.createElement('div');
      row.className = 'item' + (item.id === latestId ? ' latest' : '') + (item.done ? ' done' : '');
      const timeStr = new Date(item.created_at).toLocaleString('zh-CN', {hour12:false}).replace(/\//g, '-');

      row.innerHTML = `
        <span class="dot"></span>
        <div class="bubble">
          <div class="bubble-head">
            ${distHtml}
            <span class="tag ${cat.key}">${cat.icon} ${cat.name}</span>
            ${isMine ? radiusHtml : ''}
            ${item.done ? '<span class="tag" style="background:#e0e0e0;color:#616161;margin-left:auto;">✓ 已完成</span>' : ''}
          </div>
          <p class="text">${item.text}</p>
          ${expandBtnHtml}
          <div class="meta">
            <span class="time">${timeStr}</span>
            ${isMine ? `
              <button class="done-btn" onclick="window.toggleDone('${item.id}', ${item.done})">${item.done ? '↺ 撤销' : '✓ 完成'}</button>
              <button class="del" onclick="window.removeItem('${item.id}')">×</button>
            ` : '<span style="font-size:12px;color:#aaa;">邻居发布</span>'}
          </div>
        </div>
      `;
      listEl.appendChild(row);
    });

    const pending = filtered.filter(it => !it.done).length;
    countEl.textContent = `当前范围内共 ${filtered.length} 条 · 待完成 ${pending} 条`;
  }

  window.toggleDone = toggleDone;
  window.removeItem = removeItem;
  window.expandRadius = expandRadius; 
  btnEl.addEventListener('click', addItem);

  checkUser();
})();
</script>
</body>
</html>
