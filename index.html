<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邻里帮帮帮 - 实名互助</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --green:#4CAF50; --deep:#2f5d2f; --line:#a5d8a0; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; min-height:100vh; padding:20px 16px 80px;
    background:linear-gradient(180deg,#e3f9dd 0%,#c6f0bd 55%,#b0e9a6 100%);
    background-attachment:fixed;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    text-align:center;
  }
  .title{ margin:0; color:#1565c0; font-size:clamp(30px,9vw,50px); letter-spacing:2px; text-shadow:0 2px 0 rgba(255,255,255,.8); }
  .subtitle{ margin:10px 0 0; color:#d32f2f; font-size:clamp(24px,6vw,36px); font-weight:700; }
  .hint{ margin:6px 0 0; color:#557a55; font-size:clamp(14px,3.6vw,18px); }

  /* 认证框 */
  #authBox {
    background: #fff; max-width: 400px; margin: 30px auto; padding: 20px;
    border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center;
  }
  #authBox h3 { margin: 0 0 15px; color: #333; }
  .auth-input {
    width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc;
    border-radius: 8px; font-size: 16px; box-sizing: border-box;
  }
  .auth-btn {
    width: 100%; padding: 12px; background: var(--green); color: white;
    border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
    margin-bottom: 10px;
  }
  .auth-btn.secondary { background: #eee; color: #333; }
  .auth-msg { font-size: 14px; color: #d32f2f; margin-bottom: 10px; min-height: 20px; }

  /* 主界面 */
  #mainApp { display: none; }
  .user-bar {
    max-width: 600px; margin: 0 auto 20px; display: flex; justify-content: space-between;
    align-items: center; background: rgba(255,255,255,0.7); padding: 10px 15px; border-radius: 10px;
  }
  .logout-btn { background: #ff5252; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold;}

  .input-row{ display:flex; gap:10px; width:100%; max-width:600px; margin:24px auto 0; }
  #demandInput{
    flex:1 1 auto; min-width:0; font-size:17px; padding:14px 18px;
    border:none; border-radius:999px; outline:none; text-align:center;
    color:#222; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.08); font-family:inherit;
  }
  #submitBtn{
    flex:0 0 auto; font-size:17px; font-weight:700; padding:14px 26px;
    border:none; border-radius:999px; background:#ffd400; color:#4a3b00;
    cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.12); font-family:inherit;
  }

  .select-row{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; max-width:600px; margin:16px auto 0; }
  .select-group{ flex:1 1 45%; min-width:140px; text-align:left; }
  .select-group label{ display:block; font-size:13px; font-weight:600; color:#4c6b4c; margin-bottom:5px; padding-left:4px; }
  .select-group select{
    width:100%; font-size:15px; font-family:inherit; padding:10px 12px;
    border:1.5px solid #a5d8a0; border-radius:10px; background:#fff; color:#222;
    outline:none; cursor:pointer; appearance:none;
  }

  .chip-row{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; max-width:600px; margin:14px auto 0; }
  .chip-row .label{ width:100%; text-align:center; font-size:13px; color:#4c6b4c; margin-bottom:2px; font-weight:600; }
  .chip{
    font-size:14px; font-family:inherit; padding:8px 15px; border-radius:999px;
    border:1.5px solid transparent; background:rgba(255,255,255,.7); color:#4c6b4c;
    cursor:pointer; transition:all .18s; white-space:nowrap;
  }
  .chip.active{ background:var(--green); border-color:#3d8b40; color:#fff; font-weight:700; }

  #list{ width:100%; max-width:600px; margin:32px auto 0; text-align:left; }
  .item{ position:relative; display:flex; gap:12px; padding-bottom:18px; }
  .item::before{ content:""; position:absolute; left:7px; top:20px; bottom:-2px; width:2px; background:var(--line); }
  .item:last-child::before{ display:none; }

  .dot{ flex:0 0 auto; width:16px; height:16px; margin-top:8px; border-radius:50%; background:#bdbdbd; z-index:1; }
  .item.latest .dot{ background:var(--green); }
  .item.done .dot{ background:#9e9e9e; }

  .bubble{ flex:1 1 auto; min-width:0; padding:12px 14px; border-radius:14px; background:rgba(255,255,255,.55); opacity:.72; }
  .item.latest .bubble{ opacity:1; background:#fff; box-shadow:0 4px 14px rgba(0,0,0,.10); }
  .item.done .bubble{ opacity:.6; }

  .bubble-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .tag{ display:inline-block; font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; background:#eceff1; color:#455a64; }
  .tag.urgent{ background:#ffebee; color:#c62828; }
  .tag.tools { background:#e3f2fd; color:#1565c0; }
  .tag.errand{ background:#fff3e0; color:#e65100; }
  .tag.pet   { background:#f3e5f5; color:#6a1b9a; }
  .tag.chat  { background:#eceff1; color:#455a64; }
  .tag.zone-tag{ background:#e8f5e9; color:#2e7d32; }

  .text{ margin:0; font-size:18px; line-height:1.5; color:#222; word-break:break-word; white-space:pre-wrap; }
  .item.done .text{ text-decoration:line-through; color:#7a8c7a; }
  .meta{ display:flex; align-items:center; gap:8px; margin-top:10px; }
  .time{ margin-right:auto; font-size:12px; color:#7a8c7a; }

  .done-btn{ font-size:12px; padding:4px 12px; border-radius:999px; border:1.5px solid var(--green); background:transparent; color:#2e7d32; cursor:pointer; }
  .del{ width:22px; height:22px; border:none; border-radius:50%; background:#ff8a80; color:#fff; font-size:15px; cursor:pointer; }

  .empty{ padding:28px 0; text-align:center; color:#6b8a6b; font-size:16px; }
  .count{ margin-top:10px; text-align:center; color:#5b7a5b; font-size:14px; }
  .loading { color: #4c6b4c; padding: 20px; font-weight: bold; }
</style>
</head>
<body>

  <h1 class="title">邻里帮帮帮</h1>
  <p class="subtitle">住户互助平台</p>
  <p class="hint">有事您说话，邻居来帮忙 (实名认证系统)</p>

  <!-- 登录/注册区域 -->
  <div id="authBox">
    <h3 id="authTitle">住户实名认证登录</h3>
    <div class="auth-msg" id="authMsg"></div>
    
    <input type="email" id="emailInput" class="auth-input" placeholder="请输入邮箱 (如: zhangsan@qq.com)">
    <input type="password" id="passwordInput" class="auth-input" placeholder="请输入密码 (至少6位)">
    
    <button id="loginBtn" class="auth-btn">登 录</button>
    <button id="signupBtn" class="auth-btn secondary">注册新账号</button>
    <p style="font-size:12px; color:#888; margin-top:10px;">注：请使用真实邮箱注册，代表您接受社区实名互助公约。</p>
  </div>

  <!-- 主界面（登录后才显示） -->
  <div id="mainApp">
    <div class="user-bar">
      <span style="font-size:14px; color:#2e7d32; font-weight:bold;">👤 已实名认证：<span id="userEmail"></span></span>
      <button id="logoutBtn" class="logout-btn">退出</button>
    </div>

    <div class="input-row">
      <input id="demandInput" type="text" maxlength="60" placeholder="输入你的需求..." aria-label="输入你的需求">
      <button id="submitBtn" type="button">发布</button>
    </div>

    <div class="select-row">
      <div class="select-group">
        <label for="publishState">📍 州/直辖区：</label>
        <select id="publishState"></select>
      </div>
      <div class="select-group">
        <label for="publishDistrict">🏘️ 县/分区：</label>
        <select id="publishDistrict"></select>
      </div>
    </div>

    <div class="chip-row" id="catRow">
      <div class="label">🏷️ 分类：</div>
    </div>

    <div class="select-row">
      <div class="select-group">
        <label for="viewState">👀 查看州/直辖区：</label>
        <select id="viewState"></select>
      </div>
      <div class="select-group">
        <label for="viewDistrict">👀 查看县/分区：</label>
        <select id="viewDistrict"></select>
      </div>
    </div>

    <div id="list" class="loading">正在加载云端数据...</div>
    <div class="count" id="count"></div>
  </div>

<script>
(function () {
  'use strict';

  // ==========================================
  // 1. 填入你刚才拿到的 Supabase 钥匙
  // ==========================================
  const SUPABASE_URL = 'https://hyybzmqmrgnrfetumbhb.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_1dvjfyqSXHfo4eFBmcEdIA_m6ryxkS6';
  
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ==========================================
  // 2. 基础数据
  // ==========================================
  const MALAYSIA = [
    { key:'johor', name:'柔佛 Johor', districts:['新山 Johor Bahru','峇株巴辖 Batu Pahat','居銮 Kluang','哥打丁宜 Kota Tinggi','丰盛港 Mersing','麻坡 Muar','笨珍 Pontian','昔加末 Segamat','古来 Kulai','东甲 Tangkak']},
    { key:'kedah', name:'吉打 Kedah', districts:['华玲 Baling','万拉峇鲁 Bandar Baharu','哥打士打 Kota Setar','瓜拉姆达 Kuala Muda','古邦巴素 Kubang Pasu','居林 Kulim','浮罗交怡 Langkawi','巴东得腊 Padang Terap','锡 Sik','铅 Yan','笨筒 Pendang','波各先那 Pokok Sena']},
    { key:'kelantan', name:'吉兰丹 Kelantan', districts:['万捷 Bachok','哥打巴鲁 Kota Bharu','马樟 Machang','巴西马 Pasir Mas','巴西富地 Pasir Puteh','丹那美拉 Tanah Merah','道北 Tumpat','话望生 Gua Musang','瓜拉吉赖 Kuala Krai','日里 Jeli']},
    { key:'melaka', name:'马六甲 Melaka', districts:['亚罗牙也 Alor Gajah','野新 Jasin','马六甲中央 Melaka Tengah']},
    { key:'negeri-sembilan', name:'森美兰 Negeri Sembilan', districts:['日叻务 Jelebu','瓜拉庇劳 Kuala Pilah','波德申 Port Dickson','林茂 Rembau','芙蓉 Seremban','淡边 Tampin','仁保 Jempol']},
    { key:'pahang', name:'彭亨 Pahang', districts:['文冬 Bentong','金马仑高原 Cameron Highlands','而连突 Jerantut','关丹 Kuantan','立卑 Lipis','北根 Pekan','劳勿 Raub','淡马鲁 Temerloh','云冰 Rompin','马兰 Maran','百乐 Bera']},
    { key:'pulau-pinang', name:'槟城 Pulau Pinang', districts:['威中县 Seberang Perai Tengah','威北县 Seberang Perai Utara','威南县 Seberang Perai Selatan','东北县 Timur Laut','西南县 Barat Daya']},
    { key:'perak', name:'霹雳 Perak', districts:['峇登巴冷 Batang Padang','曼绒 Manjung','近打 Kinta','吉辇 Kerian','江沙 Kuala Kangsar','拉律峇登司南马 Larut dan Matang','下霹雳 Hilir Perak','上霹雳 Hulu Perak','中霹雳 Perak Tengah','金宝 Kampar','慕亚林 Muallim','巴眼拿督 Bagan Datuk','士南马 Selama']},
    { key:'perlis', name:'玻璃市 Perlis', districts:['玻璃市 Perlis']},
    { key:'selangor', name:'雪兰莪 Selangor', districts:['鹅唛 Gombak','巴生 Klang','瓜拉冷岳 Kuala Langat','瓜拉雪兰莪 Kuala Selangor','八打灵 Petaling','沙白安南 Sabak Bernam','雪邦 Sepang','乌鲁冷岳 Ulu Langat','乌鲁雪兰莪 Ulu Selangor']},
    { key:'terengganu', name:'登嘉楼 Terengganu', districts:['勿述 Besut','龙运 Dungun','甘马挽 Kemaman','瓜拉登嘉楼 Kuala Terengganu','马江 Marang','乌鲁登嘉楼 Hulu Terengganu','士兆 Setiu','瓜拉尼鲁斯 Kuala Nerus']},
    { key:'sabah', name:'沙巴 Sabah', districts:['斗湖 Tawau','拿笃 Lahad Datu','山打根 Sandakan','亚庇 Kota Kinabalu','根地咬 Keningau','古达 Kudat','仙本那 Semporna','保佛 Beaufort','吧巴 Papar','斗亚兰 Tuaran','兰瑙 Ranau','丹南 Tenom','担布南 Tambunan','哥打马鲁都 Kota Marudu','比鲁兰 Beluran','京那巴当岸 Kinabatangan','纳巴湾 Nabawan','必达士 Pitas','特鲁必 Telupid','东革 Tongod','古打毛律 Kota Belud','瓜拉班尤 Kuala Penyu','实必丹 Sipitang','王麻骨 Membakut','冰湘岸 Pensiangan','普南 Putatan']},
    { key:'sarawak', name:'砂拉越 Sarawak', districts:['古晋 Kuching','诗巫 Sibu','美里 Miri','民都鲁 Bintulu','木中 Betong','加帛 Kapit','林梦 Limbang','沐胶 Mukah','三马拉汉 Samarahan','泗里街 Sarikei','西连 Serian','斯里阿曼 Sri Aman','鲁勃安都 Lubok Antu','老越 Lawas','达佬 Daro','达岛 Tatau','布拉甲 Belaga','苏必士 Subis','砂拉卓 Saratok','加拿逸 Kanowit','朱劳 Julau','马拉端 Meradong','巴干 Pakan','桑坡 Song','加迪拔 Katibas','达叻 Dalat','万年烟 Balingian','马鲁帝 Marudi','巴南 Baram','德朗乌山 Telang Usan','姆鲁 Mulu']},
    { key:'kl', name:'吉隆坡 WP Kuala Lumpur', districts:['吉隆坡 Kuala Lumpur']},
    { key:'labuan', name:'纳闽 WP Labuan', districts:['纳闽 Labuan']},
    { key:'putrajaya', name:'布城 WP Putrajaya', districts:['布城 Putrajaya']}
  ];

  const CATS = [
    { key:'urgent',  name:'紧急',  icon:'⚡' },
    { key:'tools',   name:'借工具', icon:'🔧' },
    { key:'errand',  name:'代跑腿', icon:'🛒' },
    { key:'pet',     name:'宠物',   icon:'🐾' },
    { key:'chat',    name:'闲聊',   icon:'💬' }
  ];

  let STATE_MAP = {}; MALAYSIA.forEach(s => STATE_MAP[s.key] = s);
  let CAT_MAP = {}; CATS.forEach(c => CAT_MAP[c.key] = c);

  // ==========================================
  // 3. DOM 元素
  // ==========================================
  const authBox = document.getElementById('authBox');
  const mainApp = document.getElementById('mainApp');
  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  const authMsg = document.getElementById('authMsg');
  const loginBtn = document.getElementById('loginBtn');
  const signupBtn = document.getElementById('signupBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const userEmailSpan = document.getElementById('userEmail');

  const listEl = document.getElementById('list');
  const inputEl = document.getElementById('demandInput');
  const btnEl = document.getElementById('submitBtn');
  const countEl = document.getElementById('count');
  const catRow = document.getElementById('catRow');
  
  const pubStateSel = document.getElementById('publishState');
  const pubDistSel = document.getElementById('publishDistrict');
  const viewStateSel = document.getElementById('viewState');
  const viewDistSel = document.getElementById('viewDistrict');

  let currentCat = 'urgent';
  let currentPubState = 'sarawak';
  let currentPubDist = '';
  let currentViewState = 'all';
  let currentViewDist = 'all';
  
  let globalItems = [];
  let currentUser = null;

  // ==========================================
  // 4. 认证逻辑 (登录/注册/登出)
  // ==========================================
  
  async function checkUser() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      currentUser = session.user;
      showMainApp();
    } else {
      showAuthBox();
    }
  }

  function showAuthBox() {
    authBox.style.display = 'block';
    mainApp.style.display = 'none';
  }

  function showMainApp() {
    authBox.style.display = 'none';
    mainApp.style.display = 'block';
    userEmailSpan.textContent = currentUser.email;
    initSelectors();
    buildCatChips();
    fetchData();
  }

  loginBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if(!email || !password) { authMsg.textContent = '请输入邮箱和密码'; return; }
    authMsg.textContent = '登录中...';
    
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      authMsg.textContent = '登录失败：' + error.message;
    } else {
      authMsg.textContent = '';
      window.location.reload(); // 简单粗暴刷新
    }
  });

  signupBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if(!email || !password) { authMsg.textContent = '请输入邮箱和密码'; return; }
    if(password.length < 6) { authMsg.textContent = '密码至少需要6位'; return; }
    authMsg.textContent = '注册中...';
    
    const { data, error } = await supabase.auth.signUp({ email, password });
    if (error) {
      authMsg.textContent = '注册失败：' + error.message;
    } else {
      authMsg.textContent = '注册成功！请直接点击登录 (如果提示验证邮箱请去邮箱收信)';
      if(data.session) window.location.reload();
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.reload();
  });

  // ==========================================
  // 5. 数据库操作 (读取、发布、修改、删除)
  // ==========================================

  async function fetchData() {
    listEl.innerHTML = '<div class="loading">正在从云端获取数据...</div>';
    const { data, error } = await supabase
      .from('demands')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      listEl.innerHTML = '<div class="empty" style="color:red">读取失败，请检查网络或数据库设置。</div>';
      console.error(error);
      return;
    }
    
    globalItems = data;
    render();
  }

  async function addItem() {
    const text = inputEl.value.trim();
    if (!text) { inputEl.focus(); return; }
    
    btnEl.disabled = true;
    btnEl.textContent = '发布中...';

    const newItem = {
      text: text,
      cat: currentCat,
      state: currentPubState,
      district: currentPubDist,
      done: false,
      user_id: currentUser.id
    };

    const { error } = await supabase.from('demands').insert([newItem]);
    
    btnEl.disabled = false;
    btnEl.textContent = '发布';

    if (error) {
      alert('发布失败，请重试：' + error.message);
    } else {
      inputEl.value = '';
      fetchData(); // 重新拉取数据
    }
  }

  async function toggleDone(id, currentStatus) {
    const { error } = await supabase
      .from('demands')
      .update({ done: !currentStatus })
      .eq('id', id);
      
    if (!error) fetchData();
  }

  async function removeItem(id) {
    if(!confirm('确定要删除这条需求吗？')) return;
    const { error } = await supabase
      .from('demands')
      .delete()
      .eq('id', id);
      
    if (!error) fetchData();
  }

  // ==========================================
  // 6. 渲染逻辑
  // ==========================================

  function initSelectors() {
    // 发布下拉
    pubStateSel.innerHTML = MALAYSIA.map(s => `<option value="${s.key}">${s.name}</option>`).join('');
    pubStateSel.value = currentPubState;
    updatePubDistrict();
    pubStateSel.addEventListener('change', (e) => {
      currentPubState = e.target.value;
      updatePubDistrict();
    });
    pubDistSel.addEventListener('change', (e) => { currentPubDist = e.target.value; });

    // 查看下拉
    viewStateSel.innerHTML = `<option value="all">🌐 全部</option>` + MALAYSIA.map(s => `<option value="${s.key}">${s.name}</option>`).join('');
    viewStateSel.value = currentViewState;
    updateViewDistrict();
    viewStateSel.addEventListener('change', (e) => {
      currentViewState = e.target.value;
      currentViewDist = 'all';
      updateViewDistrict();
      render();
    });
    viewDistSel.addEventListener('change', (e) => {
      currentViewDist = e.target.value;
      render();
    });
  }

  function updatePubDistrict() {
    const st = STATE_MAP[currentPubState];
    pubDistSel.innerHTML = st.districts.map(d => `<option value="${d}">${d}</option>`).join('');
    currentPubDist = st.districts[0] || '';
  }

  function updateViewDistrict() {
    if (currentViewState === 'all') {
      viewDistSel.innerHTML = `<option value="all">🌐 全部</option>`;
      viewDistSel.disabled = true;
    } else {
      viewDistSel.disabled = false;
      const st = STATE_MAP[currentViewState];
      viewDistSel.innerHTML = `<option value="all">🌐 全部</option>` + st.districts.map(d => `<option value="${d}">${d}</option>`).join('');
    }
  }

  function buildCatChips() {
    let html = '<div class="label">🏷️ 分类：</div>';
    CATS.forEach(c => {
      html += `<button class="chip ${c.key === currentCat ? 'active' : ''}" data-key="${c.key}">${c.icon} ${c.name}</button>`;
    });
    catRow.innerHTML = html;
    
    catRow.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', (e) => {
        currentCat = e.target.dataset.key;
        catRow.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        render();
      });
    });
  }

  function render() {
    listEl.innerHTML = '';
    
    // 筛选数据
    const filtered = globalItems.filter(it => {
      if (currentCat !== 'all' && it.cat !== currentCat) return false;
      if (currentViewState !== 'all' && it.state !== currentViewState) return false;
      if (currentViewDist !== 'all' && it.district !== currentViewDist) return false;
      return true;
    });

    if (filtered.length === 0) {
      listEl.innerHTML = '<div class="empty">该分类下还没有需求，来发布第一条吧 ~</div>';
      countEl.textContent = '';
      return;
    }

    let latestId = filtered.find(it => !it.done)?.id;

    filtered.forEach(item => {
      const cat = CAT_MAP[item.cat] || CAT_MAP.chat;
      const st = STATE_MAP[item.state] || MALAYSIA[0];
      const isMine = item.user_id === currentUser.id;

      const row = document.createElement('div');
      row.className = 'item' + (item.id === latestId ? ' latest' : '') + (item.done ? ' done' : '');
      
      const timeStr = new Date(item.created_at).toLocaleString('zh-CN', {hour12:false}).replace(/\//g, '-');

      row.innerHTML = `
        <span class="dot"></span>
        <div class="bubble">
          <div class="bubble-head">
            <span class="tag zone-tag">📍 ${st.name.split(' ')[0]} · ${item.district.split(' ')[0]}</span>
            <span class="tag ${cat.key}">${cat.icon} ${cat.name}</span>
            ${item.done ? '<span class="tag" style="background:#e0e0e0;color:#616161;margin-left:auto;">✓ 已完成</span>' : ''}
          </div>
          <p class="text">${item.text}</p>
          <div class="meta">
            <span class="time">${timeStr}</span>
            ${isMine ? `
              <button class="done-btn" onclick="window.toggleDone('${item.id}', ${item.done})">${item.done ? '↺ 撤销' : '✓ 完成'}</button>
              <button class="del" onclick="window.removeItem('${item.id}')">×</button>
            ` : '<span style="font-size:12px;color:#aaa;">邻居发布</span>'}
          </div>
        </div>
      `;
      listEl.appendChild(row);
    });

    const pending = filtered.filter(it => !it.done).length;
    countEl.textContent = `共 ${filtered.length} 条 · 待完成 ${pending} 条`;
  }

  // 暴露给 HTML 里的 onclick 用
  window.toggleDone = toggleDone;
  window.removeItem = removeItem;
  btnEl.addEventListener('click', addItem);

  // ==========================================
  // 7. 启动
  // ==========================================
  checkUser();

})();
</script>
</body>
</html>
