      <div class="chat-messages" id="chatMessages"></div>

        <button class="chat-send" onclick="window.sendMsg()">发送</button>

    </div>
  </div>

    userEmailSpan.textContent = currentUser.email;
    initSelectors(); buildCatChips(); getUserLocation(); fetchData(); setupRealtime();

    rangeSelect.addEventListener('change', (e) => { maxDistance = parseFloat(e.target.value); render(); });
    sortSelect.addEventListener('change', (e) => { globalSort = e.target.value; render(); });
  }

  function setupRealtime() {
    if (realtimeChannel) return;
    realtimeChannel = supabase.channel('demands-changes').on('postgres_changes', { event: '*', schema: 'public', table: 'demands' }, () => fetchData(true)).subscribe();
  }

  // 图片选择预览
  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = (e) => { imagePreview.src = e.target.result; imagePreview.style.display = 'block'; };
      reader.readAsDataURL(file);
    } else {
      selectedFile = null; imagePreview.style.display = 'none'; imagePreview.src = '';
    }
  });

  // 数据拉取
  async function fetchData(silent) {
    if (!silent && globalItems.length === 0) listEl.innerHTML = '<div class="loading">加载中...</div>';
    const { data, error } = await supabase.from('demands').select('*').order('created_at', { ascending: false }).limit(100);
    if (error) { if (globalItems.length === 0) listEl.innerHTML = '<div class="empty" style="color:red">读取失败</div>'; return; }
    globalItems = data || []; render();
  }

  // 发布需求 (带图片)
  async function addItem() {
    const text = inputEl.value.trim();
    if (!text) { inputEl.focus(); return; }
    btnEl.disabled = true; btnEl.textContent = '发布中...';

    let imageUrl = null;
    // 1. 如果有图片，先上传到 Supabase Storage
    if (selectedFile) {
      const fileExt = selectedFile.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
      const { data: uploadData, error: uploadError } = await supabase.storage.from('images').upload(fileName, selectedFile);
      
      if (uploadError) { alert('图片上传失败: ' + uploadError.message); btnEl.disabled = false; btnEl.textContent = '发布'; return; }
      
      const { data: urlData } = supabase.storage.from('images').getPublicUrl(fileName);
      imageUrl = urlData.publicUrl;
    }

    // 2. 插入数据库
    const newItem = {
      text: text, cat: currentCat, state: currentPubState, district: currentPubDist,
      done: false, user_id: currentUser.id, lat: myLat, lng: myLng, radius_km: 2, image_url: imageUrl
    };

    const { data, error } = await supabase.from('demands').insert([newItem]).select();
    btnEl.disabled = false; btnEl.textContent = '发布';

    if (error) { alert('发布失败：' + error.message); return; }
    
    // 清空输入
    inputEl.value = ''; imageInput.value = ''; selectedFile = null; imagePreview.style.display = 'none';
    
    if (data && data[0]) { globalItems.unshift(data[0]); render(); } else { fetchData(true); }
  }

  // 操作函数
  async function toggleDone(id, status) { await supabase.from('demands').update({ done: !status }).eq('id', id); }
  async function removeItem(id) { if(confirm('确定删除吗？')) await supabase.from('demands').delete().eq('id', id); }
  async function expandRadius(id, r) { let nr = r === 2 ? 6 : (r === 6 ? 10 : 999); await supabase.from('demands').update({ radius_km: nr }).eq('id', id); }

  // 选择器渲染
  function initSelectors() {
    pubStateSel.innerHTML = FULL_MALAYSIA.map(s => `<option value="${s.key}">${s.name}</option>`).join('');
    pubStateSel.value = currentPubState; updatePubDistrict();
    pubStateSel.addEventListener('change', (e) => { currentPubState = e.target.value; updatePubDistrict(); });
    pubDistSel.addEventListener('change', (e) => { currentPubDist = e.target.value; });
  }
  function updatePubDistrict() {
    const st = STATE_MAP[currentPubState];
    pubDistSel.innerHTML = st.districts.map(d => `<option value="${d}">${d}</option>`).join('');
    currentPubDist = st.districts[0] || '';
  }
  function buildCatChips() {
    let html = '<div class="label">🏷️ 分类：</div>';
    CATS.forEach(c => { html += `<button class="chip ${c.key === currentCat ? 'active' : ''}" data-key="${c.key}">${c.icon} ${c.name}</button>`; });
    catRow.innerHTML = html;
    catRow.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', (e) => {
        currentCat = e.target.dataset.key; catRow.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active'); render();
      });
    });
  }

  // 渲染列表
  function render() {
    listEl.innerHTML = '';
    
    // 过滤
    let filtered = globalItems.filter(it => {
      if (currentCat !== 'all' && it.cat !== currentCat) return false;
      if (myLat && myLng && it.lat && it.lng) {
        const dist = getDistance(myLat, myLng, it.lat, it.lng);
        if (maxDistance !== 999 && dist > maxDistance) return false;
        const itemRadius = it.radius_km || 2; 
        if (itemRadius !== 999 && dist > itemRadius) return false;
      }
      return true;
    });

    // 排序 (新增距离排序)
    if (globalSort === 'distance' && myLat && myLng) {
      filtered.sort((a, b) => {
        const dA = (a.lat && a.lng) ? getDistance(myLat, myLng, a.lat, a.lng) : 99999;
        const dB = (b.lat && b.lng) ? getDistance(myLat, myLng, b.lat, b.lng) : 99999;
        return dA - dB;
      });
    }

    if (filtered.length === 0) {
      listEl.innerHTML = '<div class="empty">这里还没有此类需求~</div>'; countEl.textContent = ''; return;
    }

    let latestId = filtered.find(it => !it.done)?.id;

    filtered.forEach(item => {
      try {
        const cat = CAT_MAP[item.cat] || CAT_MAP.chat;
        const isMine = item.user_id === currentUser.id;
        
        let distHtml = '';
        if (myLat && myLng && item.lat && item.lng) {
          const dist = getDistance(myLat, myLng, item.lat, item.lng);
          let distText = dist < 1 ? Math.round(dist * 1000) + ' 米' : dist.toFixed(1) + ' 公里';
          distHtml = `<span class="tag dist-tag">🚶 距离你 ${distText}</span>`;
        }

        const r = item.radius_km || 2;
        let radiusHtml = `<span class="tag radius-tag">📢 广播 ${r === 999 ? '全城' : r + '公里'}</span>`;

        let expandBtnHtml = '';
        const publishTime = new Date(item.created_at || Date.now()).getTime();
        const diffMinutes = (Date.now() - publishTime) / 1000 / 60;
        if (isMine && !item.done && diffMinutes >= 3 && r !== 999) {
          let btnText = r === 10 ? '📢 向全城广播求助' : '📢 扩大范围 (+4公里)';
          expandBtnHtml = `<button class="expand-btn" onclick="window.expandRadius('${item.id}', ${r})">${btnText}</button>`;
        }

        // 处理图片
        let imgHtml = item.image_url ? `<img src="${item.image_url}" class="img-preview" onclick="window.open('${item.image_url}')" alt="图片">` : '';

        const row = document.createElement('div');
        row.className = 'item' + (item.id === latestId ? ' latest' : '') + (item.done ? ' done' : '');
        
        row.innerHTML = `
          <span class="dot"></span>
          <div class="bubble">
            <div class="bubble-head">
              ${distHtml}
              <span class="tag ${cat.key}">${cat.icon} ${cat.name}</span>
              ${isMine ? radiusHtml : ''}
              ${item.done ? '<span class="tag" style="background:#e0e0e0;color:#616161;margin-left:auto;">✓ 已完成</span>' : ''}
            </div>
            <p class="text">${esc(item.text)}</p>
            ${imgHtml}
            ${expandBtnHtml}
            <div class="meta">
              <span class="time">${timeAgo(item.created_at)}</span>
              ${isMine ? `
                <button class="done-btn" onclick="window.toggleDone('${item.id}', ${item.done})">${item.done ? '↺ 撤销' : '✓ 完成'}</button>
                <button class="del" onclick="window.removeItem('${item.id}')">×</button>
              ` : `
                <button class="help-btn" onclick="window.openChat('${item.id}', '${item.user_id}', '${esc(item.text).substring(0,10)}...')">💬 我来帮你</button>
              `}
            </div>
          </div>
        `;
        listEl.appendChild(row);
      } catch (err) { console.error("渲染失败", item, err); }
    });

    countEl.textContent = `当前共 ${filtered.length} 条 · 待完成 ${filtered.filter(it => !it.done).length} 条`;
  }

  // ================= 私聊功能 =================
  const chatModal = document.getElementById('chatModal');
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');

  // 打开聊天
  window.openChat = async (demandId, receiverId, titleText) => {
    if (receiverId === currentUser.id) return alert('不能和自己私聊哦');
    chatDemandId = demandId; chatReceiverId = receiverId;
    chatModal.style.display = 'flex';
    chatMessages.innerHTML = '<div style="text-align:center;color:#999;font-size:12px;">正在加载消息...</div>';
    chatInput.value = '';
    
    await loadMessages();

    // 开启实时监听当前会话的新消息
    if (chatChannel) supabase.removeChannel(chatChannel);
    chatChannel = supabase.channel('chat-' + demandId)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `demand_id=eq.${demandId}` }, payload => {
        // 收到新消息，重新加载
        loadMessages();
      }).subscribe();
  };

  window.closeChat = () => {
    chatModal.style.display = 'none';
    if (chatChannel) { supabase.removeChannel(chatChannel); chatChannel = null; }
    chatDemandId = null; chatReceiverId = null;
  };

  // 加载历史消息
  async function loadMessages() {
    const { data, error } = await supabase.from('messages')
      .select('*')
      .eq('demand_id', chatDemandId)
      .order('created_at', { ascending: true });

    if (error) { chatMessages.innerHTML = '<div style="color:red">加载失败</div>'; return; }

    // 过滤：只显示我和对方关于这个 demand 的消息
    const myMsgs = data.filter(m => 
      (m.sender_id === currentUser.id && m.receiver_id === chatReceiverId) || 
      (m.sender_id === chatReceiverId && m.receiver_id === currentUser.id)
    );

    if (myMsgs.length === 0) {
      chatMessages.innerHTML = '<div style="text-align:center;color:#999;margin-top:20px;">打个招呼吧~</div>';
    } else {
      chatMessages.innerHTML = myMsgs.map(m => `
        <div class="msg-bubble ${m.sender_id === currentUser.id ? 'msg-mine' : 'msg-other'}">
          ${esc(m.content)}
        </div>
      `).join('');
      chatMessages.scrollTop = chatMessages.scrollHeight; // 滚动到底部
    }
  }

  // 发送消息
  window.sendMsg = async () => {
    const val = chatInput.value.trim();
    if (!val) return;
    chatInput.value = '';
    chatInput.disabled = true;

    await supabase.from('messages').insert([{
      demand_id: chatDemandId, sender_id: currentUser.id, receiver_id: chatReceiverId, content: val
    }]);

    chatInput.disabled = false;
    chatInput.focus();
    // 发送后立即拉取一次（实时可能有零点几秒延迟）
    loadMessages();
  };

  // 绑定回车发送
  chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') window.sendMsg(); });

  // 全局绑定
  window.toggleDone = toggleDone; window.removeItem = removeItem; window.expandRadius = expandRadius;
  btnEl.addEventListener('click', addItem);

  checkUser();
})();
</script>
</body>
</html>
